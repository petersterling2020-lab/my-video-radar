name: Refresh and publish My Video Radar

on:
  push:
    branches: [main]
  schedule:
    # Four checks daily, with off-peak minutes to reduce schedule delays.
    - cron: '23 0,6,12,18 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch latest channel uploads and niche matches
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/refresh.py
      - name: Preserve refreshed channel IDs and video index
        run: |
          git config user.name 'video-radar-bot'
          git config user.email 'video-radar-bot@users.noreply.github.com'
          git add data/channels.json data/index.json
          if ! git diff --cached --quiet; then
            git commit -m "Update My Video Radar catalogue [skip ci]"
            git push
          fi
      - name: Prepare website for publishing
        run: |
          mkdir -p dist/data
          cp index.html styles.css app.js dist/
          cp data/index.json dist/data/index.json
          touch dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
